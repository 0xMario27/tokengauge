name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Version: tag push uses the tag (v0.2.0 -> 0.2.0); plain pushes auto-bump
      # <pkg-version>-<run_number> (0.1.0-5, 0.1.0-6, ...) - monotonically increasing.
      - name: Resolve version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(node -p "require('./package.json').version")-${{ github.run_number }}"
          fi
          echo "VER=${VER}" >> "$GITHUB_ENV"
          npm version "${VER}" --no-git-tag-version

      - name: Build arm64
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build x64
        run: npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build universal
        run: npx electron-builder --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          fail_on_unmatched_files: true

      # Plain pushes: publish an auto-versioned prerelease (tag auto-created).
      - name: Publish prerelease (plain push)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: v${{ env.VER }}
          prerelease: true
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          fail_on_unmatched_files: true
